name: Release Magnetares Notes

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente da release, por exemplo v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: magnetares-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: magnetares-linux-x64
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
            artifact: magnetares-macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -clean -trimpath -platform ${{ matrix.platform }} -webview2 download

      - name: Build Linux or macOS desktop
        if: runner.os != 'Windows'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -clean -trimpath -platform ${{ matrix.platform }}

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $binary = Get-ChildItem "apps/desktop/build/bin" -Filter *.exe | Select-Object -First 1
          Copy-Item $binary.FullName "release-assets/Magnetares-Notes-Windows-x64.exe"

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -C apps/desktop/build/bin -czf release-assets/Magnetares-Notes-Linux-x64.tar.gz .

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          APP_PATH=$(find apps/desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/Magnetares-Notes-macOS-universal.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ inputs.tag || github.sha }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: release-assets/*