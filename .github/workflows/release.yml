name: Release Magnetares Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: v1.0.0). Deixe em branco para auto-detectar do CHANGELOG.md"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publicar como pré-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: magnetares-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: magnetares-linux-x64
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
            artifact: magnetares-macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }} -webview2 download

      - name: Build Linux desktop
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build macOS desktop
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }}

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $binary = Get-ChildItem "apps/desktop/build/bin" -Filter *.exe | Select-Object -First 1
          Copy-Item $binary.FullName "release-assets/Magnetares-Notes-Windows-x64.exe"

          # 2. Gerar versão Portátil (Zip com pasta data/ e marcador portable.dat)
          $portableDir = "release-assets/Magnetares-Notes-Windows-Portable"
          New-Item -ItemType Directory -Force -Path "$portableDir/data"
          Set-Content -Path "$portableDir/portable.dat" -Value "# Modo Portatil Ativado - Dados e banco salvos nesta pasta"
          Copy-Item $binary.FullName "$portableDir/Magnetares-Notes.exe"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/Magnetares-Notes-Windows-x64-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets

          # 1. Archive tar.gz
          tar -C apps/desktop/build/bin -czf release-assets/Magnetares-Notes-Linux-x64.tar.gz .

          # Localizar o binário gerado pelo Wails
          BIN_PATH=$(find apps/desktop/build/bin -maxdepth 1 -type f -perm /111 ! -name "*.exe" ! -name "*.zip" ! -name "*.tar.gz" -print -quit)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find apps/desktop/build/bin -maxdepth 1 -type f ! -name "*.exe" ! -name "*.zip" ! -name "*.tar.gz" -print -quit)
          fi
          echo "Binário Linux encontrado em: $BIN_PATH"

          # Determinar versão para os pacotes
          VERSION="${GITHUB_REF_NAME}"
          if [[ -z "$VERSION" || "$VERSION" != v* ]]; then
            VERSION=$(grep -oE '^##\s*\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | sed -E 's/##\s*\[?v?//')
          fi
          CLEAN_VER="${VERSION#v}"
          [ -z "$CLEAN_VER" ] && CLEAN_VER="1.3.0"
          echo "Versão do pacote Linux: $CLEAN_VER"

          # 2. Gerar pacote Debian (.deb)
          DEB_ROOT="build-deb/magnetares-notes"
          rm -rf build-deb
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$DEB_ROOT/usr/share/pixmaps"

          cp "$BIN_PATH" "$DEB_ROOT/usr/bin/magnetares-notes"
          chmod 755 "$DEB_ROOT/usr/bin/magnetares-notes"
          cp apps/desktop/build/appicon.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$DEB_ROOT/usr/share/pixmaps/magnetares-notes.png"

          printf "%s\n" \
            "Package: magnetares-notes" \
            "Version: ${CLEAN_VER}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Magnetares <vitormkrewer@gmail.com>" \
            "Depends: libgtk-3-0, libwebkit2gtk-4.1-0" \
            "Description: Magnetares Notes" \
            " Modern and secure markdown notes app with local-first storage and cloud sync." \
            > "$DEB_ROOT/DEBIAN/control"

          printf "%s\n" \
            "[Desktop Entry]" \
            "Name=Magnetares Notes" \
            "Comment=Onde pensamentos ganham gravidade própria." \
            "Exec=magnetares-notes %u" \
            "Icon=magnetares-notes" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Office;Utility;TextEditor;" \
            "StartupWMClass=Magnetares Notes" \
            > "$DEB_ROOT/usr/share/applications/magnetares-notes.desktop"
          chmod 644 "$DEB_ROOT/usr/share/applications/magnetares-notes.desktop"

          dpkg-deb --build --root-owner-group "$DEB_ROOT" release-assets/Magnetares-Notes-Linux-x64.deb

          # 3. Gerar AppImage (.AppImage)
          APPDIR="build-appimage/MagnetaresNotes.AppDir"
          rm -rf build-appimage
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp "$BIN_PATH" "$APPDIR/usr/bin/magnetares-notes"
          chmod 755 "$APPDIR/usr/bin/magnetares-notes"
          cp apps/desktop/build/appicon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$APPDIR/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$APPDIR/.DirIcon"

          printf "%s\n" \
            "[Desktop Entry]" \
            "Name=Magnetares Notes" \
            "Comment=Onde pensamentos ganham gravidade própria." \
            "Exec=magnetares-notes %u" \
            "Icon=magnetares-notes" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Office;Utility;TextEditor;" \
            "StartupWMClass=Magnetares Notes" \
            > "$APPDIR/magnetares-notes.desktop"

          printf "%s\n" \
            "#!/bin/sh" \
            'SELF=$(readlink -f "$0")' \
            'HERE=${SELF%/*}' \
            'export PATH="${HERE}/usr/bin:${PATH}"' \
            'export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"' \
            'exec "${HERE}/usr/bin/magnetares-notes" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" release-assets/Magnetares-Notes-Linux-x64.AppImage

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          APP_PATH=$(find apps/desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/Magnetares-Notes-macOS-universal.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract tag and release notes from CHANGELOG
        id: release_info
        shell: python
        run: |
          import os, re

          event_name = "${{ github.event_name }}"
          ref_name = "${{ github.ref_name }}"
          input_version = "${{ inputs.version }}"

          changelog_path = "CHANGELOG.md"
          changelog_content = ""
          if os.path.exists(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as f:
                  changelog_content = f.read()

          # 1. Determine tag name
          tag = ""
          if event_name == "workflow_dispatch" and input_version.strip():
              tag = input_version.strip()
              if not tag.startswith("v"):
                  tag = f"v{tag}"
          elif event_name == "push" and ref_name and ref_name.startswith("v"):
              tag = ref_name

          if not tag:
              match = re.search(r'##\s*\[?(v?\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?)\]?', changelog_content)
              if match:
                  tag = match.group(1)
                  if not tag.startswith("v"):
                      tag = f"v{tag}"
              else:
                  tag = "v1.3.0"

          print(f"Calculated RELEASE_TAG: {tag}")

          # 2. Extract release notes for this tag
          clean_ver = tag.lstrip("v")
          pattern = rf'^##\s*\[?v?{re.escape(clean_ver)}\]?.*$'
          lines = changelog_content.splitlines()

          start_idx = None
          end_idx = None
          for i, line in enumerate(lines):
              if start_idx is None:
                  if re.match(pattern, line.strip(), re.IGNORECASE):
                      start_idx = i + 1
              else:
                  if re.match(r'^##\s+', line.strip()):
                      end_idx = i
                      break

          notes = ""
          if start_idx is not None:
              if end_idx is None:
                  end_idx = len(lines)
              notes = "\n".join(lines[start_idx:end_idx]).strip()

          notes_file = "extracted-release-notes.md"
          if notes:
              with open(notes_file, "w", encoding="utf-8") as f:
                  f.write(notes + "\n")
              print("Extracted release notes successfully.")
          else:
              with open(notes_file, "w", encoding="utf-8") as f:
                  f.write(f"Release {tag}\n")
              print("No specific section found in CHANGELOG.md, created fallback release notes.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag_name={tag}\n")
              f.write(f"body_path={notes_file}\n")

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: false
          body_path: ${{ steps.release_info.outputs.body_path }}
          files: release-assets/*