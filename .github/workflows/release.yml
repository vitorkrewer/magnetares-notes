name: Release Magnetares Notes

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: v1.0.0). Deixe em branco para auto-detectar do CHANGELOG.md"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Publicar como pré-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows/amd64
            artifact: magnetares-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux/amd64
            artifact: magnetares-linux-x64
          - name: macOS universal
            os: macos-latest
            platform: darwin/universal
            artifact: magnetares-macos-universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install frontend dependencies
        working-directory: apps/desktop/frontend
        run: npm ci --no-audit --no-fund

      - name: Resolve release metadata
        shell: bash
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION=$(grep -m1 -oE '\[v?[0-9]+\.[0-9]+\.[0-9]+[^]]*\]' CHANGELOG.md | tr -d '[]' || echo "2.0.0")
          fi
          CLEAN_VERSION="${RAW_VERSION#v}"
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "APP_VERSION=${CLEAN_VERSION}" >> "$GITHUB_ENV"
          echo "APP_BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"

      - name: Build Windows desktop
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }} -webview2 download -ldflags "-X main.AppVersion=${{ env.APP_VERSION }} -X main.AppBuildDate=${{ env.APP_BUILD_DATE }}"

      - name: Build Linux desktop
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X main.AppVersion=${{ env.APP_VERSION }} -X main.AppBuildDate=${{ env.APP_BUILD_DATE }}"

      - name: Build macOS desktop
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: wails build -skipbindings -clean -trimpath -platform ${{ matrix.platform }} -ldflags "-X main.AppVersion=${{ env.APP_VERSION }} -X main.AppBuildDate=${{ env.APP_BUILD_DATE }}"

      - name: Prepare Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $binary = Get-ChildItem "apps/desktop/build/bin" -Filter *.exe | Select-Object -First 1
          Copy-Item $binary.FullName "release-assets/Magnetares-Notes-Windows-x64.exe"

          # 2. Gerar versão Portátil (Zip com pasta data/ e marcador portable.dat)
          $portableDir = "release-assets/Magnetares-Notes-Windows-Portable"
          New-Item -ItemType Directory -Force -Path "$portableDir/data"
          Set-Content -Path "$portableDir/portable.dat" -Value "# Modo Portatil Ativado - Dados e banco salvos nesta pasta"
          Copy-Item $binary.FullName "$portableDir/Magnetares-Notes.exe"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/Magnetares-Notes-Windows-x64-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

          # 3. Gerar Instalador Windows (.exe via NSIS)
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisExe)) {
            $nsisCmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($nsisCmd) { $nsisExe = $nsisCmd.Source }
          }
          if (-not (Test-Path $nsisExe)) {
            choco install nsis -y
            $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          $exeFullPath = (Resolve-Path "release-assets/Magnetares-Notes-Windows-x64.exe").Path
          $iconFullPath = (Resolve-Path "apps/desktop/build/windows/icon.ico").Path
          $setupOutPath = Join-Path (Resolve-Path "release-assets").Path "Magnetares-Notes-Windows-x64-Setup.exe"
          & $nsisExe `
            "/DPRODUCT_VERSION=${{ env.APP_VERSION }}" `
            "/DEXE_SOURCE=$exeFullPath" `
            "/DICON_SOURCE=$iconFullPath" `
            "/DOUT_FILE=$setupOutPath" `
            "apps/desktop/build/windows/installer/magnetares.nsi"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador NSIS" }

          # 4. Gerar Instalador Corporativo Windows (.msi via WiX v4)
          dotnet tool install --global wix --version 4.0.5
          $msiVersion = if ("${{ env.APP_VERSION }}" -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { "2.1.0" }
          $msiOutPath = Join-Path (Resolve-Path "release-assets").Path "Magnetares-Notes-Windows-x64.msi"
          wix build "apps/desktop/build/windows/msi/MagnetaresNotes.wxs" `
            -arch x64 `
            -d "ProductVersion=$msiVersion" `
            -d "ExePath=$exeFullPath" `
            -d "IconPath=$iconFullPath" `
            -o "$msiOutPath"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao gerar instalador MSI" }

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets

          # 1. Archive tar.gz
          tar -C apps/desktop/build/bin -czf release-assets/Magnetares-Notes-Linux-x64.tar.gz .

          # Localizar o binário gerado pelo Wails
          BIN_PATH=$(find apps/desktop/build/bin -maxdepth 1 -type f -perm /111 ! -name "*.exe" ! -name "*.zip" ! -name "*.tar.gz" -print -quit)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find apps/desktop/build/bin -maxdepth 1 -type f ! -name "*.exe" ! -name "*.zip" ! -name "*.tar.gz" -print -quit)
          fi
          echo "Binário Linux encontrado em: $BIN_PATH"

          # Determinar versão para os pacotes
          VERSION="${GITHUB_REF_NAME}"
          if [[ -z "$VERSION" || "$VERSION" != v* ]]; then
            VERSION=$(grep -oE '^##\s*\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | sed -E 's/##\s*\[?v?//')
          fi
          CLEAN_VER="${VERSION#v}"
          [ -z "$CLEAN_VER" ] && CLEAN_VER="1.3.0"
          echo "Versão do pacote Linux: $CLEAN_VER"

          # 2. Gerar pacote Debian (.deb)
          DEB_ROOT="build-deb/magnetares-notes"
          rm -rf build-deb
          mkdir -p "$DEB_ROOT/DEBIAN"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/metainfo"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$DEB_ROOT/usr/share/pixmaps"

          cp "$BIN_PATH" "$DEB_ROOT/usr/bin/magnetares-notes"
          chmod 755 "$DEB_ROOT/usr/bin/magnetares-notes"
          cp apps/desktop/build/appicon.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$DEB_ROOT/usr/share/pixmaps/magnetares-notes.png"
          cp packaging/linux/io.github.vitorkrewer.MagnetaresNotes.metainfo.xml "$DEB_ROOT/usr/share/metainfo/io.github.vitorkrewer.MagnetaresNotes.metainfo.xml"

          printf "%s\n" \
            "Package: magnetares-notes" \
            "Version: ${CLEAN_VER}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Magnetares <vitormkrewer@gmail.com>" \
            "Depends: libgtk-3-0, libwebkit2gtk-4.1-0" \
            "Description: Magnetares Notes" \
            " Modern and secure markdown notes app with local-first storage and cloud sync." \
            > "$DEB_ROOT/DEBIAN/control"

          printf "%s\n" \
            "[Desktop Entry]" \
            "Name=Magnetares Notes" \
            "Comment=Onde pensamentos ganham gravidade própria." \
            "Exec=magnetares-notes %u" \
            "Icon=magnetares-notes" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Office;Utility;TextEditor;" \
            "StartupWMClass=Magnetares Notes" \
            > "$DEB_ROOT/usr/share/applications/magnetares-notes.desktop"
          chmod 644 "$DEB_ROOT/usr/share/applications/magnetares-notes.desktop"

          dpkg-deb --build --root-owner-group "$DEB_ROOT" release-assets/Magnetares-Notes-Linux-x64.deb

          # 3. Gerar AppImage (.AppImage)
          APPDIR="build-appimage/MagnetaresNotes.AppDir"
          rm -rf build-appimage
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp "$BIN_PATH" "$APPDIR/usr/bin/magnetares-notes"
          chmod 755 "$APPDIR/usr/bin/magnetares-notes"
          cp apps/desktop/build/appicon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$APPDIR/magnetares-notes.png"
          cp apps/desktop/build/appicon.png "$APPDIR/.DirIcon"

          printf "%s\n" \
            "[Desktop Entry]" \
            "Name=Magnetares Notes" \
            "Comment=Onde pensamentos ganham gravidade própria." \
            "Exec=magnetares-notes %u" \
            "Icon=magnetares-notes" \
            "Terminal=false" \
            "Type=Application" \
            "Categories=Office;Utility;TextEditor;" \
            "StartupWMClass=Magnetares Notes" \
            > "$APPDIR/magnetares-notes.desktop"

          printf "%s\n" \
            "#!/bin/sh" \
            'SELF=$(readlink -f "$0")' \
            'HERE=${SELF%/*}' \
            'export PATH="${HERE}/usr/bin:${PATH}"' \
            'export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"' \
            'exec "${HERE}/usr/bin/magnetares-notes" "$@"' \
            > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          curl -sL https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" release-assets/Magnetares-Notes-Linux-x64.AppImage

          # 4. Gerar pacote Flatpak (.flatpak) para lojas Linux (Flathub, Mint, elementary, Pop!_OS, GNOME)
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

          mkdir -p packaging/flatpak/dist
          cp "$BIN_PATH" packaging/flatpak/dist/magnetares-notes
          chmod 755 packaging/flatpak/dist/magnetares-notes

          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build packaging/flatpak/io.github.vitorkrewer.MagnetaresNotes.yml
          flatpak build-bundle flatpak-repo release-assets/Magnetares-Notes-Linux-x64.flatpak io.github.vitorkrewer.MagnetaresNotes --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
          rm -rf flatpak-build flatpak-repo packaging/flatpak/dist

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          APP_PATH=$(find apps/desktop/build/bin -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/Magnetares-Notes-macOS-universal.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  build-snap:
    name: Build Linux Snap (.snap)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux binary artifact
        uses: actions/download-artifact@v4
        with:
          name: magnetares-linux-x64
          path: linux-artifact

      - name: Prepare Snap staging
        shell: bash
        run: |
          mkdir -p packaging/snap/staging
          tar -xzf linux-artifact/Magnetares-Notes-Linux-x64.tar.gz -C packaging/snap/staging
          BIN_FOUND=$(find packaging/snap/staging -maxdepth 1 -type f ! -name "*.png" ! -name "*.desktop" | head -n 1)
          if [ "$(basename "$BIN_FOUND")" != "magnetares-notes" ]; then
            mv "$BIN_FOUND" packaging/snap/staging/magnetares-notes
          fi
          chmod 755 packaging/snap/staging/magnetares-notes
          cp packaging/snap/gui/magnetares-notes.desktop packaging/snap/staging/magnetares-notes.desktop
          cp apps/desktop/build/appicon.png packaging/snap/staging/magnetares-notes.png
          cp packaging/linux/io.github.vitorkrewer.MagnetaresNotes.metainfo.xml packaging/snap/staging/io.github.vitorkrewer.MagnetaresNotes.metainfo.xml

          CLEAN_VER=$(grep -oE '^##\s*\[?v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -n 1 | sed -E 's/##\s*\[?v?//' || echo "2.1.0")
          sed -i "s/^version:.*/version: '${CLEAN_VER}'/" packaging/snap/snapcraft.yaml

      - name: Build Snap package
        id: snapcraft
        uses: snapcore/action-build@v1
        with:
          path: packaging/snap

      - name: Rename and upload Snap artifact
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ steps.snapcraft.outputs.snap }}" release-assets/Magnetares-Notes-Linux-x64.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: magnetares-linux-snap
          path: release-assets/Magnetares-Notes-Linux-x64.snap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-snap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build Multiverse Portable Package (Cross-Platform Pendrive)
        shell: bash
        run: |
          MULTIVERSE_DIR="Magnetares-Notes-Multiverse-Portable"
          rm -rf "$MULTIVERSE_DIR"
          mkdir -p "$MULTIVERSE_DIR/data"
          touch "$MULTIVERSE_DIR/data/.gitkeep"

          # 1. Marcador de modo portátil
          echo "# Magnetares Notes - Multiverse Portable" > "$MULTIVERSE_DIR/portable.dat"
          echo "# Todos os dados locais, notas e banco SQLite sao salvos dentro da pasta ./data" >> "$MULTIVERSE_DIR/portable.dat"

          # 2. Copiar binário Windows
          if [ -f "release-assets/Magnetares-Notes-Windows-x64.exe" ]; then
            cp "release-assets/Magnetares-Notes-Windows-x64.exe" "$MULTIVERSE_DIR/Magnetares-Notes.exe"
          fi

          # 3. Copiar binário Linux (AppImage)
          if [ -f "release-assets/Magnetares-Notes-Linux-x64.AppImage" ]; then
            cp "release-assets/Magnetares-Notes-Linux-x64.AppImage" "$MULTIVERSE_DIR/Magnetares-Notes-Linux.AppImage"
            chmod +x "$MULTIVERSE_DIR/Magnetares-Notes-Linux.AppImage"
          fi

          # 4. Descompactar e incluir o bundle macOS
          if [ -f "release-assets/Magnetares-Notes-macOS-universal.zip" ]; then
            unzip -q "release-assets/Magnetares-Notes-macOS-universal.zip" -d "$MULTIVERSE_DIR/"
          fi

          # 5. Criar LEIA-ME explicativo
          printf "%s\n" \
            "=====================================================" \
            " MAGNETARES NOTES - VERSAO PORTABLE MULTIVERSE" \
            "=====================================================" \
            "" \
            "Esta versao foi criada para rodar diretamente a partir de um pendrive" \
            "ou HD externo, compartilhando as mesmas notas entre multiplos sistemas operacionais." \
            "" \
            "COMO USAR NO SEU PENDRIVE:" \
            "-----------------------------------------------------" \
            "1. Windows:" \
            "   - De duplo clique em 'Magnetares-Notes.exe'." \
            "" \
            "2. Linux:" \
            "   - Execute 'Magnetares-Notes-Linux.AppImage'" \
            "   - Se necessario, conceda permissao de execucao:" \
            "     chmod +x Magnetares-Notes-Linux.AppImage" \
            "" \
            "3. macOS:" \
            "   - Execute 'Magnetares Notes.app'." \
            "   - Na primeira execucao, se o macOS avisar sobre desenvolvedor nao identificado:" \
            "     Clique com botao direito no aplicativo -> selecione 'Abrir' -> confirme." \
            "" \
            "ONDE FICAM SUAS NOTAS?" \
            "-----------------------------------------------------" \
            "Todas as notas, listas, tarefas e configuracoes sao armazenadas na pasta:" \
            "./data/magnetares.db" \
            "" \
            "O banco de dados SQLite e universal: alteracoes feitas no Windows estarao" \
            "disponiveis imediatamente no Mac e no Linux e vice-versa." \
            "" \
            "RECOMENDACAO:" \
            "-----------------------------------------------------" \
            "- Formate seu pendrive como exFAT para compatibilidade nativa de leitura" \
            "  e escrita entre Windows, macOS e Linux." \
            "- Sempre feche o aplicativo e use a opcao 'Ejetar com seguranca' antes de" \
            "  remover o pendrive." \
            "=====================================================" \
            > "$MULTIVERSE_DIR/LEIA-ME-MULTIVERSE.txt"

          # 6. Garantir permissões de execução nos binários Linux e macOS
          chmod +x "$MULTIVERSE_DIR"/*.AppImage 2>/dev/null || true
          find "$MULTIVERSE_DIR" -type f -path "*/Contents/MacOS/*" -exec chmod +x {} + 2>/dev/null || true

          # 7. Gerar arquivo compactado final para o release
          zip -r -q "release-assets/Magnetares-Notes-Multiverse-Portable.zip" "$MULTIVERSE_DIR"
          rm -rf "$MULTIVERSE_DIR"
          echo "Pacote Multiverse Portable gerado com sucesso: release-assets/Magnetares-Notes-Multiverse-Portable.zip"


      - name: Extract tag and release notes from CHANGELOG
        id: release_info
        shell: python
        run: |
          import os, re

          event_name = "${{ github.event_name }}"
          ref_name = "${{ github.ref_name }}"
          input_version = "${{ inputs.version }}"

          changelog_path = "CHANGELOG.md"
          changelog_content = ""
          if os.path.exists(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as f:
                  changelog_content = f.read()

          # 1. Determine tag name
          tag = ""
          if event_name == "workflow_dispatch" and input_version.strip():
              tag = input_version.strip()
              if not tag.startswith("v"):
                  tag = f"v{tag}"
          elif event_name == "push" and ref_name and ref_name.startswith("v"):
              tag = ref_name

          if not tag:
              match = re.search(r'##\s*\[?(v?\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?)\]?', changelog_content)
              if match:
                  tag = match.group(1)
                  if not tag.startswith("v"):
                      tag = f"v{tag}"
              else:
                  tag = "v1.3.0"

          print(f"Calculated RELEASE_TAG: {tag}")

          # 2. Extract release notes for this tag
          clean_ver = tag.lstrip("v")
          pattern = rf'^##\s*\[?v?{re.escape(clean_ver)}\]?.*$'
          lines = changelog_content.splitlines()

          start_idx = None
          end_idx = None
          for i, line in enumerate(lines):
              if start_idx is None:
                  if re.match(pattern, line.strip(), re.IGNORECASE):
                      start_idx = i + 1
              else:
                  if re.match(r'^##\s+', line.strip()):
                      end_idx = i
                      break

          notes = ""
          if start_idx is not None:
              if end_idx is None:
                  end_idx = len(lines)
              notes = "\n".join(lines[start_idx:end_idx]).strip()

          notes_file = "extracted-release-notes.md"
          if notes:
              with open(notes_file, "w", encoding="utf-8") as f:
                  f.write(notes + "\n")
              print("Extracted release notes successfully.")
          else:
              with open(notes_file, "w", encoding="utf-8") as f:
                  f.write(f"Release {tag}\n")
              print("No specific section found in CHANGELOG.md, created fallback release notes.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tag_name={tag}\n")
              f.write(f"body_path={notes_file}\n")

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: false
          body_path: ${{ steps.release_info.outputs.body_path }}
          files: release-assets/*